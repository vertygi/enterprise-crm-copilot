<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      background: #131d2b;
      color: #f1f5f9;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #28374a;
    }

    .header h1 {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .shortcut {
      font-size: 10px;
      color: #8a9bb0;
      background: #1a2636;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #28374a;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .label {
      font-size: 11px;
      color: #8a9bb0;
      font-weight: 600;
    }

    .input {
      width: 100%;
      background: #1a2636;
      border: 1px solid #28374a;
      border-radius: 4px;
      padding: 6px 8px;
      color: #f1f5f9;
      font-size: 12px;
      outline: none;
    }

    .input:focus {
      border-color: #22a079;
    }

    .row-2 {
      display: flex;
      gap: 8px;
    }

    .row-2 .field {
      flex: 1;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #22a079;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1b8463;
    }

    .btn-secondary {
      background: #1a2636;
      border-color: #28374a;
      color: #f1f5f9;
    }

    .btn-secondary:hover {
      border-color: #8a9bb0;
    }

    .status {
      display: none;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .status.ok {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      display: block;
    }

    .status.err {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Настройки</h1>
    <span class="shortcut">Alt + A</span>
  </div>

  <div class="form">
    <div class="field">
      <span class="label">Быстрые пресеты</span>
      <div style="display:flex; gap:4px;">
        <button type="button" class="btn btn-secondary" id="pop-preset-deepseek-v3" style="font-size:10px; padding:4px 5px;">DeepSeek V3</button>
        <button type="button" class="btn btn-secondary" id="pop-preset-deepseek-r1" style="font-size:10px; padding:4px 5px;">DeepSeek R1</button>
        <button type="button" class="btn btn-secondary" id="pop-preset-local" style="font-size:10px; padding:4px 5px;">Локальный</button>
      </div>
    </div>

    <div class="field">
      <span class="label">URL API</span>
      <input class="input" id="pop-url" placeholder="https://api.deepseek.com/chat/completions">
    </div>

    <div class="field">
      <span class="label">Модель</span>
      <input class="input" id="pop-model" placeholder="qwen2.5:latest, llama3.1...">
    </div>

    <div class="field">
      <span class="label">API-ключ</span>
      <input class="input" id="pop-key" type="password" placeholder="Опционально">
    </div>

    <div class="row-2">
      <div class="field">
        <span class="label">temperature</span>
        <input class="input" id="pop-temp" type="number" step="0.05" min="0" max="2" value="0.7">
      </div>
      <div class="field">
        <span class="label">max_tokens</span>
        <input class="input" id="pop-max" type="number" step="128" placeholder="2048">
      </div>
    </div>

    <div class="field">
      <span class="label">thinking_budget_tokens</span>
      <input class="input" id="pop-think" type="number" step="128" placeholder="0">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="pop-save">Сохранить</button>
      <button class="btn btn-secondary" id="pop-test">Проверить</button>
    </div>

    <div class="status" id="pop-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
